name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the development version; 3.13 guards against accidentally
        # depending on a 3.14-only feature. Every pin in requirements.txt has
        # wheels for both.
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The runner has no Le Mans Ultimate installation, so the tests that
        # need a real session file skip themselves. Everything else - the
        # layout classifier, the unit conversions, the file name parser, the
        # reader against synthetic databases - runs here.
        run: pytest -q
