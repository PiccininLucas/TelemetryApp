[pytest]
testpaths = tests
# The project root on sys.path, so `import lmu_telemetry` works without an
# install step. Keeps the setup to "create a venv, install requirements, run".
pythonpath = .
addopts = -ra --strict-markers
filterwarnings =
    error
    # DuckDB and pyarrow both still emit these on Python 3.14.
    default::DeprecationWarning
