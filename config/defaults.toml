# Default configuration for the LMU Telemetry Analyzer.
#
# Every numeric threshold used by the analysis layer lives here, never inline in
# the code. Two reasons: thresholds are engineering choices that need to be
# defensible and tunable per car/track, and hardcoded magic numbers are the
# fastest way to make an analysis impossible to audit later.
#
# Phase 1 only populates the keys that phase 1 and 2 actually consume. The rest
# of the file grows as the corresponding phase is implemented.

[ingest]
# Common time grid all channels are resampled onto (Hz). 100 Hz is above the
# highest per-channel rate we expect, so resampling never has to decimate a
# fast channel - it only upsamples slow ones.
target_hz = 100.0

[ingest.time_base]
# Continuous channels carry no timestamp column: time is implicit, t[i] = i/f.
# GPS Time is a real clock recorded as a continuous channel, so it lets us test
# that assumption. If the game stalls or pauses mid-recording, index and time
# stop matching and every downstream alignment silently lies.
#
# Maximum tolerated drift between the index-derived time and GPS Time, in
# seconds, before the time base is rebuilt from GPS Time and a warning is
# raised to the user.
max_drift_s = 0.05

# Minimum number of valid GPS Time samples required before we trust it enough
# to validate (let alone correct) the time base.
min_gps_samples = 100

[laps]
# A lap's measured span (time between two consecutive "Lap" events) must match
# the official time the game reports for it. When it does not, the recording
# does not cover the whole lap - normal for the first and last lap of every
# session - and the lap is marked partial.
#
# Measured against real sessions the agreement is within 0.02 s for complete
# laps, so 0.5 s is loose enough to never produce a false positive and tight
# enough to catch a genuinely truncated lap.
max_time_mismatch_s = 0.5

[analysis.distance]
# Lap Dist is recorded at 10 Hz. At 250 km/h that is one sample every 7 m,
# which cannot locate a braking point. Distance is therefore rebuilt by
# integrating Ground Speed (100 Hz, ~0.7 m between samples) and then rescaled so
# the lap closes on its known length, removing the drift the integration
# accumulates.
#
# Reject the scale correction outside this band: a factor far from 1 means the
# integration or the reference length is wrong, and silently stretching the lap
# to fit would hide it.
min_scale_factor = 0.9
max_scale_factor = 1.1

[analysis.resample]
# Every lap-to-lap comparison happens in the distance domain, never in time.
step_m = 1.0

[analysis.corners]
# Smoothing window for the speed trace, as a fraction of lap length. About 1% of
# a lap is long enough to remove sample noise and short enough to keep a real
# corner's minimum where it belongs.
smoothing_window_fraction = 0.01
savgol_polynomial_order = 3

# A corner is a local speed minimum below this fraction of the lap's maximum
# speed. Above it, the "minimum" is just a fast kink.
speed_threshold_fraction = 0.85

# Two minima closer together than this are one corner, not two.
min_separation_m = 50.0

# Pedals are fractions here (the file stores percent; ingest converts).
brake_threshold = 0.03
brake_min_duration_s = 0.1
throttle_threshold = 0.2
throttle_min_duration_s = 0.1

# Coasting: neither pedal meaningfully applied.
coast_brake_max = 0.03
coast_throttle_max = 0.05

# Split a slow stretch into separate corners at any internal speed peak rising
# by at least this fraction of the lap maximum. Without it, corners linked by a
# short burst of throttle - Lesmo 1 into Lesmo 2, the apexes of Ascari - never
# rise back above the corner threshold and are reported as a single corner.
split_prominence_fraction = 0.08

[analysis.ideal_lap]
# Segment boundaries sit midway along the straight between one corner and the
# next, never at an apex, so braking, apex and exit stay in one segment.
boundary_position = 0.5

[analysis.consistency]
# Laps slower than the median by more than this fraction are dropped before
# measuring dispersion: a lap spoiled by traffic says nothing about the driver's
# repeatability.
max_lap_time_excess = 0.05
min_laps = 3

[analysis.friction]
# Points below this speed are excluded from the g-g diagram. At a standstill the
# accelerometers register noise that would inflate the envelope.
min_speed_ms = 10.0

[analysis.trackmap]
# WGS-84 equatorial radius, used by the equirectangular projection.
earth_radius_m = 6378137.0
# Heading integration needs a forward speed floor: omega = a_y / V explodes as V
# approaches zero.
min_speed_ms = 5.0

[surfaces]
# SurfaceTypes codes, one per wheel, sampled at 5 Hz.
#
# Nothing in the file documents this enum. It was identified empirically by
# correlating each code with speed and lateral g over two full race sessions:
#
#   code 0  ~176 km/h                 track
#   code 2  ~18 km/h (Monza excursion) grass
#   code 4  ~39 km/h                  gravel
#   code 5  ~128 km/h, highest g_lat  kerb  (fast and loaded: being ridden)
#   code 6  ~132-186 km/h             other legal surface (astroturf / paint)
#
# Codes 1 and 3 were never observed; they are included from the rFactor 2
# convention LMU inherits (1 = wet track, 3 = dirt) and should be treated as
# unverified.
off_track_codes = [2, 3, 4]

# Fraction of a lap's wheel-samples that must be off track before the lap is
# flagged. One wheel brushing grass for a moment is not an off-track lap: at
# Le Mans that happens at 163 km/h without the driver losing anything.
min_off_track_fraction = 0.01

